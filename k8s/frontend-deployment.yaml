apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: devopshub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: mannu0/devopshub-frontend:2.0
          ports:
            - containerPort: 80
